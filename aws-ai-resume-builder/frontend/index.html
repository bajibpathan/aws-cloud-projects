<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AWS AI Resume Builder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>AWS AI Resume Builder</h1>

            <p>
                Securely upload your resume for
                AI-powered analysis.
            </p>
        </header>

        <!-- Login section -->
        <section
            id="login-section"
            class="card"
        >
            <h2>Sign In</h2>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="sign-in-button"
                >
                    Sign In
                </button>
            </form>
        </section>

        <!-- Upload section -->
        <section
            id="upload-section"
            class="card"
            hidden
        >
            <h2>Upload Resume</h2>

            <p id="signed-in-user"></p>

            <div class="form-group">
                <label for="resume-file">
                    Select your resume
                </label>

                <input
                    type="file"
                    id="resume-file"
                    accept=".pdf,application/pdf"
                >
            </div>

            <button
                type="button"
                id="upload-button"
            >
                Upload Resume
            </button>

            <button
                type="button"
                id="sign-out-button"
                class="secondary-button"
            >
                Sign Out
            </button>
        </section>

        <!-- Status section -->
        <section class="card status-card">
            <h2>Status</h2>

            <p
                id="status-message"
                role="status"
                aria-live="polite"
            >
                Please sign in to continue.
            </p>
        </section>
    </main>

    <!-- Cognito browser library must load before app.js -->
    <script
        src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"
    ></script>

    <script src="app.js"></script>
</body>
</html>
